plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.logistics.packages'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:3.1.1"
        // Testcontainers 1.20.4+ soporta Docker Desktop 29.x en Windows con WSL2
        // Sobrescribe la versión 1.19.7 que trae Spring Boot 3.2.5
        mavenBom "org.testcontainers:testcontainers-bom:1.20.4"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core:10.10.0'
    implementation 'org.flywaydb:flyway-database-postgresql:10.10.0'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    implementation 'org.mapstruct:mapstruct:1.6.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation "org.testcontainers:localstack"
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.h2database:h2'
}

tasks.named('test') {
    jvmArgs("-XX:+EnableDynamicAgentLoading")
    useJUnitPlatform()

    // ── Configuración de Docker para Testcontainers en Windows ────────────────
    // TCP en localhost:2375 es la única forma confiable de comunicación en Windows
    // con Docker Desktop backend WSL2. Las estrategias de Named Pipe fallan con
    // status 400 porque docker-java no soporta el protocolo relay de Docker Desktop.
    // En CI/CD (Linux/Mac), DOCKER_HOST ya viene seteado o Testcontainers lo detecta solo.
    def envDockerHost = System.getenv("DOCKER_HOST") ?: ""
    if (envDockerHost.isEmpty()) {
        def osName = System.properties["os.name"]?.toLowerCase() ?: ""
        if (osName.contains("windows")) {
            // TCP a localhost:2375 (requiere "Expose daemon on tcp://localhost:2375" en Docker Desktop Settings)
            def dockerTcp = "tcp://localhost:2375"
            environment "DOCKER_HOST", dockerTcp
            systemProperty "docker.host", dockerTcp
        }
    } else {
        environment "DOCKER_HOST", envDockerHost
        systemProperty "docker.host", envDockerHost
    }
    // ─────────────────────────────────────────────────────────────────────────
}
