# Propagación de DOCKER_HOST al Gradle Daemon en Windows
# Permite que el daemon padre (y todos sus procesos hijos) hereden la configuración de Docker
# Sin esto, los procesos child de Gradle pueden no tener acceso a DOCKER_HOST del environment
# Compatible con CI/CD: en Linux/Mac este valor es ignorado si DOCKER_HOST ya está en el ambiente
systemProp.DOCKER_HOST=tcp://localhost:2375
