spring.application.name=logistics-packages

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logistics-packages}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Flyway
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

# AWS
spring.cloud.aws.region.static=${SPRING_CLOUD_AWS_REGION_STATIC}
spring.cloud.aws.credentials.access-key=${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS-KEY}
spring.cloud.aws.credentials.secret-key=${SPRING_CLOUD_AWS_CREDENTIALS_SECRET-KEY}
spring.cloud.aws.sqs.endpoint=${SPRING_CLOUD_AWS_SQS_ENDPOINT}
spring.cloud.aws.s3.endpoint=${SPRING_CLOUD_AWS_S3_ENDPOINT}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:logistics-packages}


# AWS SQS Queue Configuration
aws.sqs.ruta-request-queue=${DEV_PREFIX:carlos}-solicitar-ruta-queue
aws.sqs.ruta-response-queue=${DEV_PREFIX:carlos}-respuestas-ruta-queue
aws.sqs.clasificacion-queue=paquete-listo-clasificar-queue
app.sqs.eventos-paquete-queue=${DEV_PREFIX:carlos}-eventos-paquete-queue
app.sqs.eventos-financieros-queue=eventos-financieros-paquete-queue

# Geocoding Configuration (MOD1-UC-001 FR-002)
app.geocoding.timeout-ms=${GEOCODING_TIMEOUT_MS:5000}

# Coverage Area Configuration (MOD1-UC-001 FR-001) - Colombia completa (11 sedes)
app.coverage.latitud-min=${COVERAGE_LATITUD_MIN:3.0}
app.coverage.latitud-max=${COVERAGE_LATITUD_MAX:12.0}
app.coverage.longitud-min=${COVERAGE_LONGITUD_MIN:-77.0}
app.coverage.longitud-max=${COVERAGE_LONGITUD_MAX:-72.0}

# OpenAPI / Swagger
springdoc.packages-to-scan=com.logistics.packages.infrastructure.controller
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html

# Static resources
spring.web.resources.add-mappings=true

# PostMan
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.flyway.enabled=true
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always
