spring.application.name=logistics-packages

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-on-migrate=true

# AWS
spring.cloud.aws.region.static=${SPRING_CLOUD_AWS_REGION_STATIC}
spring.cloud.aws.credentials.access-key=${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS-KEY}
spring.cloud.aws.credentials.secret-key=${SPRING_CLOUD_AWS_CREDENTIALS_SECRET-KEY}
spring.cloud.aws.sqs.endpoint=${SPRING_CLOUD_AWS_SQS_ENDPOINT}
spring.cloud.aws.s3.endpoint=${SPRING_CLOUD_AWS_S3_ENDPOINT}


# RabbitMQ Configuration (MOD1-IP-003)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Messaging Configuration
app.messaging.ruta.request.exchange=solicitudes_ruta_exchange
app.messaging.ruta.request.queue=solicitudes_ruta_queue
app.messaging.ruta.request.routing-key=solicitud.nueva
app.messaging.ruta.response.queue=respuestas_ruta_queue
app.messaging.ruta.dlx.exchange=solicitudes_ruta_dlx
app.messaging.ruta.dlx.queue=solicitudes_ruta_dlq

# Messaging Configuration - Eventos de Ruta (MOD1-UC-007)
app.messaging.ruta.eventos.queue=eventos_ruta_queue
app.messaging.ruta.eventos.exchange=eventos_ruta_exchange
app.messaging.ruta.eventos.routing-key=evento.ruta

# Geocoding Configuration (MOD1-UC-001 FR-002)
app.geocoding.timeout-ms=${GEOCODING_TIMEOUT_MS:5000}

# Coverage Area Configuration (MOD1-UC-001 FR-001)
app.coverage.latitud-min=${COVERAGE_LATITUD_MIN:4.0}
app.coverage.latitud-max=${COVERAGE_LATITUD_MAX:5.0}
app.coverage.longitud-min=${COVERAGE_LONGITUD_MIN:-75.0}
app.coverage.longitud-max=${COVERAGE_LONGITUD_MAX:-74.0}

# PostMan
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.flyway.enabled=true
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always
