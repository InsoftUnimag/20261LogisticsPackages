spring.application.name=logistics-packages

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-on-migrate=true

# AWS
spring.cloud.aws.region.static=${SPRING_CLOUD_AWS_REGION_STATIC}
spring.cloud.aws.credentials.access-key=${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS-KEY}
spring.cloud.aws.credentials.secret-key=${SPRING_CLOUD_AWS_CREDENTIALS_SECRET-KEY}
spring.cloud.aws.sqs.endpoint=${SPRING_CLOUD_AWS_SQS_ENDPOINT}
spring.cloud.aws.s3.endpoint=${SPRING_CLOUD_AWS_S3_ENDPOINT}


# AWS SQS Queue Configuration
aws.sqs.ruta-request-queue=${DEV_PREFIX:carlos}-solicitar-ruta-queue
aws.sqs.ruta-response-queue=respuestas-ruta-queue
aws.sqs.ruta-event-queue=solicitudes-ruta-event-queue
aws.sqs.clasificacion-queue=paquete-listo-clasificar-queue
aws.sqs.eventos-ruta-queue=eventos-ruta-queue

# Geocoding Configuration (MOD1-UC-001 FR-002)
app.geocoding.timeout-ms=${GEOCODING_TIMEOUT_MS:5000}

# Coverage Area Configuration (MOD1-UC-001 FR-001)
app.coverage.latitud-min=${COVERAGE_LATITUD_MIN:4.0}
app.coverage.latitud-max=${COVERAGE_LATITUD_MAX:5.0}
app.coverage.longitud-min=${COVERAGE_LONGITUD_MIN:-75.0}
app.coverage.longitud-max=${COVERAGE_LONGITUD_MAX:-74.0}

# OpenAPI / Swagger
springdoc.packages-to-scan=com.logistics.packages.infrastructure.controller
springdoc.paths-to-match=/api/**,/route/**
springdoc.swagger-ui.path=/swagger-ui.html

# Static resources
spring.web.resources.add-mappings=true

# PostMan
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.flyway.enabled=true
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always
