spring:
  jpa:
    open-in-view: false
  cloud:
    flyway:
      baseline-on-migrate: true
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      endpoint: http://localhost:4566
      sqs:
        ruta-request-queue: ${DEV_PREFIX:carlos}-solicitar-ruta-queue

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  geocoding:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    timeout-ms: 5000
  coverage:
    latitud-min: 4.0
    latitud-max: 12.0
    longitud-min: -77.0
    longitud-max: -72.0
  sede:
    latitud: 4.624335
    longitud: -74.063644
  jwt:
    secret: ${JWT_SECRET:dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIEpXVCB0b2tlbiBpbiBsb2dpc3RpY3MgcGFja2FnZXMgYXBpIDIwMjY=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
